services:
  - type: web
    name: propagation
    runtime: node
    plan: free
    buildCommand: echo ok
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      # Facultatif mais nécessaire pour les parties de plusieurs jours : voir le README
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
